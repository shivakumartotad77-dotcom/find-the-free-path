<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Free Path</title>
<style>
:root{--ink:#0a0f3a;--title:#3c4663;--blue:#1e88e5;--soft:#eef2f8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
.app{width:min(100%,520px);margin:auto;padding:14px 16px 26px;text-align:center}
h1{margin:6px 0 22px;font-size:clamp(34px,10vw,48px);line-height:1.08;font-weight:800;color:var(--title);letter-spacing:-.5px}
.row{display:flex;align-items:center;justify-content:space-between}
.lvl{font-weight:600;font-size:18px}
#emo{font-size:22px;margin-left:4px}
.ib{background:none;border:0;color:var(--blue);padding:4px;width:40px;height:40px;cursor:pointer}
.ib svg{width:100%;height:100%}
.chip{background:var(--soft);border-radius:12px;padding:10px 16px;font-size:18px;font-weight:600;color:#4c5878;min-width:84px;box-shadow:0 2px 8px #0000000d;display:flex;align-items:center;justify-content:center;gap:8px}
.hearts{font-size:32px;letter-spacing:5px;line-height:1}
.h-off{filter:grayscale(1) opacity(.35)}
#wrap{width:100%;aspect-ratio:1;overflow:auto;margin:16px 0 8px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}#board{display:block;width:100%;aspect-ratio:1}
.tools{display:flex;justify-content:center;gap:24px;margin-top:14px}
.tool{position:relative;width:72px;height:72px;border-radius:50%;border:0;background:#fff;color:var(--blue);box-shadow:0 8px 22px #1e88e533,0 0 0 1px #eef2f8;cursor:pointer;transition:transform .12s}
.tool:active{transform:scale(.93)}
.tool svg{width:34px;height:34px}
.badge{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;border:2px solid #fff}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.levels{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;max-height:380px;overflow:auto;padding:2px}
.levels.show{display:grid}
.lv{border:1px solid #dbe3ef;background:var(--soft);border-radius:14px;padding:8px 0 6px;font-size:11px;color:#4c5878;cursor:pointer}
.lv b{display:block;font-size:24px;font-weight:400;line-height:1.2}
.lv.cur{border:2px solid var(--blue);background:#fff}
.lv:disabled{opacity:.35;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;max-width:92vw;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0a0f3a99;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{width:min(100%,340px);background:#fff;border-radius:26px;padding:28px 24px;box-shadow:0 24px 70px #0006}
.card .e{font-size:52px}.card h2{margin:8px 0 6px}.card p{color:#5a6685;font-size:14px;line-height:1.6;margin:0 0 12px}
.btn{width:100%;min-height:50px;border-radius:15px;border:0;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.go{background:var(--blue);color:#fff}.no{background:var(--soft);color:var(--ink)}
.dwrap{position:relative}
button.chip{border:0;font-family:inherit;cursor:pointer;color:#4c5878}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 12px 30px #0a0f3a30;z-index:6;overflow:hidden;min-width:200px;text-align:left}
.menu.show{display:block}
.menu button{display:block;width:100%;background:none;border:0;padding:12px 16px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.menu button small{display:block;font-weight:400;color:#6a7694;font-size:12px;margin-top:2px}
.menu button.on{background:var(--soft);color:var(--blue)}
#zoom{font:700 20px "Segoe UI",system-ui,sans-serif}
.ad{position:fixed;inset:0;background:#05081f;color:#fff;display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.ad.show{display:flex}
.adb{width:min(100%,340px);text-align:center}
.adb small{letter-spacing:2px;color:#8fa0e8}
.adbox{height:200px;border:2px dashed #3b4a8a;border-radius:18px;display:grid;place-items:center;font-size:20px;margin:14px 0;color:#9fb0ff}
.aud{display:flex;justify-content:center;gap:10px;margin-top:18px}
.pill{border:1px solid #dbe3ef;background:var(--soft);color:#4c5878;border-radius:99px;padding:9px 16px;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.pill.off{opacity:.5}
.topbar{display:flex;justify-content:flex-end}
.coins{display:flex;align-items:center;gap:8px;border:1px solid #f0cf72;background:linear-gradient(145deg,#fff8e1,#ffecb0);border-radius:99px;padding:6px 15px 6px 7px;font-weight:800;font-size:17px;color:#8a5a00;box-shadow:0 4px 14px #f0b43033}
.coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb52e 60%,#d9840f);display:grid;place-items:center;font-style:normal;font-size:14px;color:#7a4300}
.coinfly{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb52e 60%,#d9840f);color:#7a4300;font:800 14px/26px sans-serif;text-align:center;pointer-events:none;z-index:12;box-shadow:0 2px 8px #0006}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar"><div class="coins" id="coinbox"><i>★</i><span id="coins">0</span></div></div>
  <h1>Find the<br>Free Path</h1>
  <div class="row">
    <button class="ib" id="restart" aria-label="Restart level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl">Level <span id="level">1</span><span id="emo"></span></div>
    <button class="ib" id="gear" aria-label="Choose level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3L7 21M17 3l-2 18M3 9h18M2 15h18"/></svg></button>
  </div>
  <div class="row" style="margin-top:6px">
    <div class="chip"><svg width="20" height="20" viewBox="0 0 24 24" fill="#4c5878"><path d="M3 21l3-9 5 5zM9 15L21 3l-3 12-5 3z"/></svg><span id="left">0</span></div>
    <div class="hearts" id="lives"></div>
    <div class="dwrap"><button class="chip" id="diff">Easy ▾</button><div class="menu" id="menu">
      <button data-d="easy">Easy<small>80–100 arrows</small></button>
      <button data-d="normal">Normal<small>150–200 arrows</small></button>
      <button data-d="hard">Difficult<small>400–450 arrows</small></button></div></div>
  </div>
  <div id="wrap"><svg id="board" viewBox="0 0 600 600" role="img" aria-label="Arrow maze board"></svg></div>
  <div class="tools">
    <button class="tool" id="hint" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hints">3</span></button>
    <button class="tool" id="zoom" aria-label="Zoom">1×</button>
    <button class="tool" id="grid" aria-label="Choose level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3L7 21M17 3l-2 18M3 9h18M2 15h18"/></svg></button>
  </div>
  <div class="aud"><button class="pill" id="sfx">🔊 Sound</button><button class="pill" id="mus">🎵 Music</button></div>
  <div class="levels" id="levels"></div>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><div class="e" id="mE">🏆</div><h2 id="mT">Level cleared!</h2><p id="mP"></p><button class="btn go" id="mNext">Next level</button><button class="btn no" id="mClose">Close</button></div></div>
<canvas id="fw"></canvas>
<div class="ad" id="ad"><div class="adb"><small>ADVERTISEMENT</small><div class="adbox">📺 Your ad plays here</div><p id="adt">Reward in <b>5</b>s</p><button class="btn go" id="adbtn" style="display:none">Continue playing</button></div></div>
<script>
(() => {
'use strict';
const NS='http://www.w3.org/2000/svg',SIZE=600;let GRID=24,CELL=SIZE/GRID;
const sp=s=>s.trim().split(/\s+/),uniq=a=>[...new Set(a)];
// 100 animals & birds, 100 main shapes & symbols, then 300 picks of my own (food, plants, vehicles, places, objects, sports, clothes, sky…)
const A=sp('🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐒 🦍 🐺 🐗 🐴 🦄 🦓 🦌 🐂 🐃 🐄 🐎 🐖 🐏 🐑 🐐 🐪 🐫 🦙 🦒 🐘 🦏 🦛 🐁 🐀 🐇 🐿 🦔 🦇 🦘 🦥 🦦 🦨 🦡 🐕 🐩 🐈 🐅 🐆 🐦 🐧 🦆 🦅 🦉 🦜 🦢 🦩 🦚 🐓 🦃 🐔 🐤 🐥 🐣 🕊 🐝 🐛 🦋 🐌 🐞 🐜 🦗 🕷 🦂 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦐 🦞 🦀 🐡 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🦟 🐾 🐉 🐲').slice(0,100);

const C0=sp('🍎 🍏 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🍈 🍒 🍑 🍍 🥭 🥥 🥝 🍅 🍆 🥑 🥦 🥬 🥒 🌶 🌽 🥕 🧄 🧅 🥔 🍠 🥜 🍞 🥐 🥖 🥨 🥯 🥞 🧇 🧀 🍖 🍗 🥩 🥓 🍔 🍟 🍕 🌭 🥪 🌮 🌯 🥙 🥚 🍳 🥘 🍲 🥣 🥗 🍿 🧈 🍱 🍘 🍙 🍚 🍛 🍜 🍝 🍣 🍤 🍥 🥟 🥠 🥡 🍦 🍧 🍨 🍩 🍪 🎂 🍰 🧁 🥧 🍫 🍬 🍭 🍮 🍯 🍼 🥛 ☕ 🍵 🍶 🍾 🍷 🍸 🍹 🍺 🍻 🥂 🥃 🥤 🧃 🌵 🎄 🌲 🌳 🌴 🌱 🌿 ☘ 🍀 🎍 🎋 🍃 🍂 🍁 🍄 🌾 💐 🌷 🌹 🥀 🌺 🌸 🌼 🌻 🚗 🚕 🚙 🚌 🚎 🏎 🚓 🚑 🚒 🚐 🚚 🚛 🚜 🛵 🏍 🚲 🛴 🚂 🚆 🚇 🚊 🚁 ✈ 🛩 🚀 🛸 🚢 ⛵ 🛶 ⛴ 🚤 🏠 🏡 🏢 🏣 🏥 🏦 🏨 🏪 🏫 🏭 🏰 🏯 🗼 🗽 ⛪ 🕌 ⛩ 🏟 🎡 🎢 🎠 ⛲ ⛺ 🌋 🏔 🗻 🏝 📱 💻 ⌨ 🖥 🖨 🖱 💽 💾 📀 📷 📸 📹 🎥 📞 ☎ 📟 📠 📺 📻 🎙 🎚 🎛 ⏱ ⏲ 🕰 ⌚ 💡 🔦 🕯 🔋 🔌 💰 💳 💵 🧾 ✉ 📧 📦 📫 📮 📝 📖 📚 📓 📔 📒 📕 📗 📘 📙 🔖 🏷 📅 📆 📇 📈 📉 📊 📋 📍 📏 🎸 🎺 🎻 🥁 🎹 🎷 🎤 🎧 🎬 🎮 🕹 🎳 ⚽ 🏀 🏈 ⚾ 🥎 🎾 🏐 🏉 🥏 🎱 🏓 🏸 🏒 🏑 🥍 🏏 ⛳ 🏹 🎣 🥊 🥋 ⛸ 🎿 🛷 🥅 👕 👖 🧣 🧤 🧥 🧦 👗 👘 👙 👚 👛 👜 👝 🎒 👞 👟 🥾 👠 👡 👢 👒 🎩 🎓 🧢 ⛑ 👓 🕶 🥽 🧳 🌂 ☂ 🌍 🌎 🌏 🌕 🌖 🌗 🌘 🌑 🌒 🌓 🌔 🌚 🌝 🌞 ☄ 🌠 🌌 🌊 🌪 ⛈ ⛅ ☔ ⛄ ☃ 🎃 👻 💀 ☠ 👽 👾 🤖 🎅 🤡 👹 👺 😈 👀 👁 👂 👃 👄 🦷 🦴 🧠 👣 ✋ ✌ 👍 👎 👏 🙏 💪 ☝ 🤟 🧰 🧯 🧴 🧼 🧽 🧹 🧺 🧻 🛁 🚿 🚽 🛏 🛋 🚪 🖼 🔭 🔬 🧪 🧫 🧬 💉 💊 🎭 🎨 🖌 🖍 🧵 🧶');
const B=uniq(B0).filter(e=>!A.includes(e)).slice(0,100);
const C=uniq(C0).filter(e=>!A.includes(e)&&!B.includes(e)).slice(0,300);
const EM=A.concat(B,C),N=EM.length;
let level=1,best=1,lives=3,hints=3,snakes=[],busy=false,MASK=[],COL='#0a0f3a',diff='easy',zoom=1,A1=null,A2=null,coins=0,shown=0,lvlCoins=0;
const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n),key=(x,y)=>x+','+y;
function el(t,a={},p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n}
// Turn an emoji into a silhouette (works for any grid size) + the picture's own colour.
function tint(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return`hsl(${Math.round(h)},${Math.round(Math.max(s,.12)*100)}%,${Math.round(Math.min(l,.4)*100)}%)`}
function prep(e){
 const W=256,cv=document.createElement('canvas');cv.width=cv.height=W;
 const x=cv.getContext('2d',{willReadFrequently:true});
 x.font='200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#000';
 x.fillText(e+'\uFE0F',W/2,W/2+8);
 const d=x.getImageData(0,0,W,W).data;
 let x0=W,y0=W,x1=-1,y1=-1,R=0,G=0,B=0,n=0,R2=0,G2=0,B2=0,n2=0;
 for(let y=0;y<W;y++)for(let u=0;u<W;u++){const i=(y*W+u)*4,a=d[i+3];if(a>60){if(u<x0)x0=u;if(u>x1)x1=u;if(y<y0)y0=y;if(y>y1)y1=y;if(a>200){const r=d[i],g=d[i+1],b=d[i+2];R2+=r;G2+=g;B2+=b;n2++;if(Math.max(r,g,b)-Math.min(r,g,b)>45){R+=r;G+=g;B+=b;n++}}}}
 if(x1<0)return null;
 return{d,W,x0,y0,x1,y1,c:n>n2*.08?tint(R/n,G/n,B/n):n2?tint(R2/n2,G2/n2,B2/n2):'#0a0f3a'};
}
function maskOf(p,G){
 const bw=p.x1-p.x0+1,bh=p.y1-p.y0+1,sc=G/Math.max(bw,bh),ox=(G-bw*sc)/2,oy=(G-bh*sc)/2,m=[];let cnt=0;
 for(let cy=0;cy<G;cy++)for(let cx=0;cx<G;cx++){
  let k=0;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){
   const sx=Math.floor(p.x0+(cx+(i+.5)/3-ox)/sc),sy=Math.floor(p.y0+(cy+(j+.5)/3-oy)/sc);
   if(sx>=p.x0&&sx<=p.x1&&sy>=p.y0&&sy<=p.y1&&p.d[(sy*p.W+sx)*4+3]>100)k++;
  }
  const on=k>=5;m.push(on);if(on)cnt++;
 }
 return{m,cnt};
}
function circleMask(G){const m=[],r=G/2;for(let y=0;y<G;y++)for(let x=0;x<G;x++)m.push((x+.5-r)**2+(y+.5-r)**2<r*r*.95);return m}
// Arrow counts per difficulty. The grid grows with the count (and with arrow length) so every picture can hold that many long arrows.
const CFG={easy:{lo:80,hi:100,max:44,cpa:9,z:1.5,label:'Easy'},normal:{lo:150,hi:200,max:52,cpa:7,z:2,label:'Normal'},hard:{lo:400,hi:450,max:64,cpa:5.5,z:2,label:'Difficult'}};
const Z=[1,1.5,2,3];
const inside=(x,y)=>MASK[y*GRID+x];
const dirOf=(a,b)=>b.x>a.x?'R':b.x<a.x?'L':b.y>a.y?'D':'U';
const vec=d=>d==='R'?{x:1,y:0}:d==='L'?{x:-1,y:0}:d==='D'?{x:0,y:1}:{x:0,y:-1};
const mk=(path,id)=>({id,path,dir:dirOf(path[path.length-2],path[path.length-1]),alive:true});
function rayFree(s,own){
 const d=vec(s.dir),h=s.path[s.path.length-1];let x=h.x+d.x,y=h.y+d.y;
 while(x>=0&&y>=0&&x<GRID&&y<GRID){const o=own[y*GRID+x];if(o&&o!==s.id)return false;x+=d.x;y+=d.y}

}
function ownOf(list){const o=new Int32Array(GRID*GRID);for(const s of list)if(s.alive)for(const p of s.path)o[p.y*GRID+p.x]=s.id;return o}
// Returns the ids of arrows that can never escape.
function peel(list){
 const own=new Int32Array(GRID*GRID);list.forEach(s=>s.path.forEach(p=>own[p.y*GRID+p.x]=s.id));

 while(ch){ch=false;for(const s of list)if(left.has(s.id)&&rayFree(s,own)){left.delete(s.id);s.path.forEach(p=>own[p.y*GRID+p.x]=0);ch=true}}
 return left;
}
function generate(){
 const {lo,hi}=CFG[diff],mid=(lo+hi)/2,cells=[],t0=performance.now(),D4=[[1,0],[-1,0],[0,1],[0,-1]];
 for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)if(inside(x,y))cells.push({x,y});
 // Long, winding arrows. Each new arrow needs a clear run to the edge past everything placed before it, so the board is always solvable.
 const build=maxL=>{
  const minL=Math.max(3,Math.round(maxL*.4)),occ=new Uint8Array(GRID*GRID),list=[];let uid=0;
  const order=cells.map(c=>({c,k:Math.min(c.x,c.y,GRID-1-c.x,GRID-1-c.y)+Math.random()*GRID*.4})).sort((a,b)=>b.k-a.k).map(o=>o.c);
  const free=(x,y,loc)=>x>=0&&y>=0&&x<GRID&&y<GRID&&inside(x,y)&&!occ[y*GRID+x]&&!loc.has(y*GRID+x);
  const clearRay=(h,d)=>{let x=h.x+d.x,y=h.y+d.y;while(x>=0&&y>=0&&x<GRID&&y<GRID){if(occ[y*GRID+x])return false;x+=d.x;y+=d.y}return true};
  const place=(a,b)=>{for(const c of order){
   if(occ[c.y*GRID+c.x])continue;
   for(let tr=0;tr<4;tr++){
    const target=a+rand(b-a+1),path=[c],loc=new Set([c.y*GRID+c.x]);
    while(path.length<target){
     const cur=path[path.length-1],opts=D4.map(d=>({x:cur.x+d[0],y:cur.y+d[1]})).filter(q=>free(q.x,q.y,loc));
     if(!opts.length)break;

 const own=ownOf(snakes),a=snakes.find(s=>s.alive&&rayFree(s,own));if(!a){toast('No free arrow. Press back to restart.');return}
 hints--;stats();save();sfxHint();
 const g=$('board').querySelector(`[data-id="${a.id}"]`),ln=g.querySelector('.ln'),w=$('wrap'),h=px(a.path[a.path.length-1]);
 w.scrollLeft=h[0]/SIZE*$('board').clientWidth-w.clientWidth/2;w.scrollTop=h[1]/SIZE*$('board').clientHeight-w.clientHeight/2;
 ln.setAttribute('stroke-width',SW()*2.6);setTimeout(()=>ln.setAttribute('stroke-width',SW()),2200);
 g.animate([{opacity:1},{opacity:.15},{opacity:1}],{duration:600,iterations:3});
};
function toggle(){
 const L=$('levels');
 if(!L.classList.contains('show')){
  L.innerHTML=EM.map((e,i)=>`<button class="lv${i+1===level?' cur':''}" data-l="${i+1}"${i+1>best?' disabled':''}><b>${e}</b>${i+1}</button>`).join('');
  L.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{level=+b.dataset.l;L.classList.remove('show');fresh()});
 }
 L.classList.toggle('show');
}
$('gear').onclick=toggle;$('grid').onclick=toggle;
$('zoom').onclick=()=>setZoom(Z[(Z.indexOf(zoom)+1)%Z.length]);
const dm=$('menu');
$('diff').onclick=e=>{e.stopPropagation();dm.classList.toggle('show')};
document.addEventListener('click',()=>dm.classList.remove('show'));
dm.querySelectorAll('button').forEach(b=>b.onclick=()=>{
 dm.classList.remove('show');if(b.dataset.d===diff||busy)return;
 diff=b.dataset.d;zoom=CFG[diff].z;fresh();toast(CFG[diff].label+': '+CFG[diff].lo+'–'+CFG[diff].hi+' arrows');
});
try{const m=JSON.parse(localStorage.getItem('fp_meta')||'{}');level=Math.min(N,Math.max(1,m.level||1));best=Math.max(level,m.best||1);if(CFG[m.diff])diff=m.diff;if(m.hints!=null)hints=m.hints;coins=shown=+m.coins||0}catch(e){}
zoom=CFG[diff].z;
fresh(true);
})();
</script>
</body>
</html>
